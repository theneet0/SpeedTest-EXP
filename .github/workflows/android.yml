name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare deliverables
        run: |
          ARM64_APK="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$ARM64_APK"
          grep -q 'arm64-v8a' app/build/outputs/apk/debug/output-metadata.json
          cp "$ARM64_APK" SpeedLab-arm64-v8a-debug.apk
          zip -qr SpeedLab-source.zip . -x '.git/*' '.gradle/*' '*/build/*' 'SpeedLab-*.apk' 'SpeedLab-source.zip'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLab-arm64-deliverables
          path: |
            SpeedLab-arm64-v8a-debug.apk
            SpeedLab-source.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish new GitHub prerelease
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download tested deliverables
        uses: actions/download-artifact@v4
        with:
          name: SpeedLab-arm64-deliverables
          path: release-assets

      - name: Check for an existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare versioned release assets
        if: steps.release_check.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv release-assets/SpeedLab-arm64-v8a-debug.apk "release-assets/SpeedLab-v$VERSION-arm64-v8a-beta.apk"
          mv release-assets/SpeedLab-source.zip "release-assets/SpeedLab-v$VERSION-source.zip"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create GitHub prerelease
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" "release-assets/SpeedLab-v$VERSION-arm64-v8a-beta.apk" "release-assets/SpeedLab-v$VERSION-source.zip" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SpeedLab v$VERSION Beta" --notes-file RELEASE_NOTES.md --prerelease
