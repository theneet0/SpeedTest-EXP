name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare deliverables
        run: |
          ARM64_APK="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$ARM64_APK"
          grep -q 'arm64-v8a' app/build/outputs/apk/debug/output-metadata.json
          cp "$ARM64_APK" SpeedLab-arm64-v8a-debug.apk
          zip -qr SpeedLab-source.zip . -x '.git/*' '.gradle/*' '*/build/*' 'SpeedLab-*.apk' 'SpeedLab-source.zip'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLab-arm64-deliverables
          path: |
            SpeedLab-arm64-v8a-debug.apk
            SpeedLab-source.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish v0.9.1 prerelease
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release:v0.9.1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download tested deliverables
        uses: actions/download-artifact@v4
        with:
          name: SpeedLab-arm64-deliverables
          path: release-assets

      - name: Prepare versioned release assets
        run: |
          mv release-assets/SpeedLab-arm64-v8a-debug.apk release-assets/SpeedLab-v0.9.1-arm64-v8a-beta.apk
          mv release-assets/SpeedLab-source.zip release-assets/SpeedLab-v0.9.1-source.zip
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.1 release-assets/SpeedLab-v0.9.1-arm64-v8a-beta.apk release-assets/SpeedLab-v0.9.1-source.zip release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SpeedLab v0.9.1 Beta" --notes-file RELEASE_NOTES.md --prerelease
