name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare deliverables
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeedLab-debug.apk
          zip -qr SpeedLab-source.zip . -x '.git/*' '.gradle/*' '*/build/*' 'SpeedLab-debug.apk' 'SpeedLab-source.zip'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLab-deliverables
          path: |
            SpeedLab-debug.apk
            SpeedLab-source.zip
          if-no-files-found: error
          retention-days: 30
